name: Refresh data and deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 11 * * *' # daily, 11:00 UTC
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Burned-area history is slow to download and only changes yearly, so the committed copy is used.
      # If a source is down, the build falls back to the data committed in the repository.
      - name: Refresh public data
        run: npm run data -- flows pipelines-us hotspots weather || echo "::warning::Data refresh failed, deploying with committed data"
      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
